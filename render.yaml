services:
  - type: web
    name: synex-cloud-crm
    env: node
    plan: free
    buildCommand: chmod +x build.sh && bash build.sh
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: WEBHOOK_VERIFY_TOKEN
        value: antigravity_webhook_secret_2026
